
services:

  backend:
    build: ./backend
    container_name: smartrail-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: smartrail-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  ml-engine:
    build: ./ml-engine
    container_name: smartrail-ml
    ports:
      - "8000:8000"
    restart: unless-stopped
